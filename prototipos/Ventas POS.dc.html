<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #F7F0E6; }
  a { color: #B87A56; text-decoration: none; }
  a:hover { color: #4A342A; }
  input::placeholder { color: #C7B69C; }
  input:focus { outline: none; border-color: #B87A56 !important; box-shadow: 0 0 0 3px rgba(184,122,86,.15) !important; }
</style>
</helmet>
<div style="min-height:100vh;display:flex;background:#F7F0E6;font-family:'Work Sans',system-ui,sans-serif;color:#4A342A">

  <aside style="width:232px;flex:none;background:#FFFCF7;border-right:1px solid #E4D6C3;display:flex;flex-direction:column;gap:26px;padding:24px 16px;position:sticky;top:0;height:100vh;box-sizing:border-box">
    <div style="display:flex;align-items:center;gap:11px;padding:0 6px">
      <div style="width:34px;height:34px;border-radius:11px;background:#F1E6D6;border:1px dashed #E4D6C3;flex:none"></div>
      <span style="font-family:'Fraunces',Georgia,serif;font-size:18px;font-weight:600;line-height:1.1">ShowroomCiro</span>
    </div>
    <nav style="display:flex;flex-direction:column;gap:2px">
      <div style="padding:0 8px 8px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#B9A890;font-weight:600">Operación</div>
      <sc-for list="{{ nav }}" as="item" hint-placeholder-count="6">
        <a href="#" style="{{ item.style }}">
          <span style="{{ item.dotStyle }}"></span>
          <span style="flex:1">{{ item.label }}</span>
          <sc-if value="{{ item.badge }}" hint-placeholder-val="{{ false }}">
            <span style="min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#D4694A;color:#FFF8F0;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center">{{ item.badge }}</span>
          </sc-if>
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:13px;background:#F7F0E6;border:1px solid #E4D6C3">
      <span style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#B9A890;font-weight:600">Caja</span>
      <span style="display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;color:#6B7A4F">
        <span style="width:7px;height:7px;border-radius:50%;background:#6B7A4F"></span>Abierta desde 09:40
      </span>
    </div>
  </aside>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column">

    <header style="display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 28px;background:#FFFCF7;border-bottom:1px solid #E4D6C3">
      <div style="display:flex;flex-direction:column;gap:2px">
        <span style="font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:600">ShowroomCiro</span>
        <span style="font-size:12.5px;color:#A89479">Punto de venta</span>
      </div>
      <div style="display:flex;align-items:center;gap:14px">
        <div style="position:relative;display:flex;align-items:center">
        <button type="button" onClick="{{ toggleMenu }}" style="display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;border-radius:999px;background:#F7F0E6;border:1px solid #E4D6C3;cursor:pointer;font-family:'Work Sans',sans-serif;color:#4A342A;transition:border-color .15s" style-hover="border-color:#B87A56">
          <span style="width:30px;height:30px;border-radius:50%;background:#B87A56;color:#FFF8F0;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center">{{ inicial }}</span>
          <span style="display:flex;flex-direction:column;line-height:1.2">
            <span style="font-size:13px;font-weight:600">{{ usuario }}</span>
            <span style="font-size:11px;color:#A89479">{{ rol }}</span>
          </span>
          <span style="font-size:11px;color:#A89479;line-height:1;padding-left:2px">▾</span>
        </button>
        <sc-if value="{{ menuAbierto }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;top:calc(100% + 8px);right:0;min-width:186px;padding:6px;border-radius:14px;background:#FFFCF7;border:1px solid #E4D6C3;box-shadow:0 18px 36px -20px rgba(74,52,42,.5);z-index:30">
            <button type="button" style="width:100%;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:12px 13px;border:0;border-radius:10px;background:transparent;cursor:pointer;font-family:'Work Sans',sans-serif;font-size:14px;font-weight:600;color:#4A342A;text-align:left;transition:all .15s" style-hover="background:#B87A56;color:#FFF8F0">
              <span style="width:6px;height:6px;border-radius:50%;background:#B87A56;flex:none"></span>Cerrar sesión
            </button>
          </div>
        </sc-if>
      </div>
      </div>
    </header>

    <div style="flex:1;display:flex;align-items:stretch;min-width:0">

      <main style="flex:1;min-width:0;padding:24px 28px 32px;display:flex;flex-direction:column;gap:18px">

        <div style="display:flex;align-items:center;gap:12px;padding:0 18px;background:#FFFFFF;border:1px solid #E4D6C3;border-radius:14px;box-shadow:0 10px 26px -24px rgba(74,52,42,.5)">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#B87A56" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <input type="text" placeholder="Buscar por nombre o SKU…" style="flex:1;border:0;outline:none;background:transparent;padding:16px 0;font-family:'Work Sans',sans-serif;font-size:15.5px;color:#4A342A" />
          <span style="font-size:11.5px;color:#B9A890;border:1px solid #E4D6C3;border-radius:7px;padding:3px 7px;font-weight:500">F2</span>
        </div>

        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <sc-for list="{{ categorias }}" as="c" hint-placeholder-count="5">
            <button type="button" onClick="{{ c.onClick }}" style="{{ c.style }}">{{ c.label }}</button>
          </sc-for>
        </div>

        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px">
          <sc-for list="{{ productos }}" as="p" hint-placeholder-count="8">
            <button type="button" style="text-align:left;padding:0;overflow:hidden;background:#FFFCF7;border:1px solid #E4D6C3;border-radius:15px;cursor:pointer;display:flex;flex-direction:column;font-family:'Work Sans',sans-serif;transition:all .15s;box-shadow:0 10px 24px -24px rgba(74,52,42,.5)" style-hover="border-color:#B87A56;transform:translateY(-2px)">
              <span style="height:132px;display:flex;align-items:flex-end;justify-content:center;padding:10px;box-sizing:border-box;background:repeating-linear-gradient(135deg,#F1E6D6 0 8px,#EADCC8 8px 16px)">
                <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:#9C8974;background:#FFFCF7;border-radius:6px;padding:3px 7px">{{ p.ph }}</span>
              </span>
              <span style="display:flex;flex-direction:column;gap:5px;padding:12px 13px 14px">
                <span style="font-size:14px;font-weight:600;line-height:1.3">{{ p.nombre }}</span>
                <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:#A89479">{{ p.sku }}</span>
                <span style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:2px">
                  <span style="font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:600">{{ p.precio }}</span>
                  <span style="font-size:11.5px;color:{{ p.stockColor }};font-weight:500">{{ p.stock }}</span>
                </span>
              </span>
            </button>
          </sc-for>
        </div>
      </main>

      <aside style="width:344px;flex:none;background:#FFFCF7;border-left:1px solid #E4D6C3;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;box-sizing:border-box">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 22px 14px">
          <h2 style="margin:0;font-family:'Fraunces',Georgia,serif;font-size:21px;font-weight:600">Carrito</h2>
          <span style="font-size:12.5px;color:#A89479">{{ cantItems }} ítems</span>
        </div>

        <div style="flex:1;overflow:auto;padding:0 18px;display:flex;flex-direction:column;gap:10px">
          <sc-for list="{{ carrito }}" as="i" hint-placeholder-count="3">
            <div style="display:flex;gap:12px;padding:12px;border-radius:13px;background:#FFFFFF;border:1px solid #E4D6C3">
              <span style="width:52px;height:60px;flex:none;border-radius:9px;background:repeating-linear-gradient(135deg,#F1E6D6 0 6px,#EADCC8 6px 12px)"></span>
              <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
                <span style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
                  <span style="font-size:13.5px;font-weight:600;line-height:1.3">{{ i.nombre }}</span>
                  <button type="button" style="border:0;background:transparent;padding:0 2px;color:#C7B69C;font-size:15px;line-height:1;cursor:pointer" style-hover="color:#7A2E2A">×</button>
                </span>
                <span style="font-size:12px;color:#8C7660">{{ i.variante }}</span>
                <span style="display:flex;align-items:center;justify-content:space-between;gap:8px">
                  <span style="display:flex;align-items:center;gap:1px;border:1px solid #E4D6C3;border-radius:9px;overflow:hidden">
                    <button type="button" style="border:0;background:#FFFCF7;width:26px;height:26px;font-size:14px;color:#6B5545;cursor:pointer" style-hover="background:#F1E6D6">−</button>
                    <span style="width:26px;text-align:center;font-size:13px;font-weight:600">{{ i.qty }}</span>
                    <button type="button" style="border:0;background:#FFFCF7;width:26px;height:26px;font-size:14px;color:#6B5545;cursor:pointer" style-hover="background:#F1E6D6">+</button>
                  </span>
                  <span style="font-family:'Fraunces',Georgia,serif;font-size:15px;font-weight:600">{{ i.subtotal }}</span>
                </span>
              </span>
            </div>
          </sc-for>
        </div>

        <div style="border-top:1px solid #E4D6C3;padding:18px 22px 22px;display:flex;flex-direction:column;gap:14px;background:#FFFCF7">
          <div style="display:flex;flex-direction:column;gap:7px">
            <div style="display:flex;justify-content:space-between;font-size:13.5px;color:#8C7660"><span>Subtotal</span><span>{{ total }}</span></div>
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
              <span style="font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#A89479">Total</span>
              <span style="font-family:'Fraunces',Georgia,serif;font-size:31px;font-weight:600;line-height:1;letter-spacing:-0.01em">{{ total }}</span>
            </div>
          </div>
          <button type="button" style="width:100%;padding:16px;border:0;border-radius:12px;background:#B87A56;color:#FFF8F0;font-family:'Work Sans',sans-serif;font-size:16px;font-weight:600;letter-spacing:.02em;cursor:pointer;box-shadow:0 8px 18px -12px rgba(184,122,86,.9);transition:background .15s" style-hover="background:#A56A48" style-active="background:#95603F">Cobrar</button>
        </div>
      </aside>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;usuario&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Marcos&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;rol&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Dueño&quot;,&quot;Vendedor&quot;],&quot;default&quot;:&quot;Dueño&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { cat: "Todos" };
  renderVals() {
    const usuario = this.props.usuario ?? "Marcos";
    const rol = this.props.rol ?? "Dueño";
    const navItems = [
      { label: "Dashboard" }, { label: "Productos" },
      { label: "Caja" }, { label: "Cuentas", badge: "3" },
      { label: "Reportes", owner: true }, { label: "Usuarios", owner: true },
    ].filter(i => !i.owner || rol === "Dueño");

    const cats = ["Todos", "Remeras", "Pantalones", "Abrigos", "Vestidos", "Accesorios"];
    const prods = [
      { nombre: "Camisa lino beige", sku: "CAM-LIN-001", precio: "$ 42.000", cat: "Remeras", stock: "2 u.", low: true },
      { nombre: "Remera algodón peinado", sku: "REM-ALG-014", precio: "$ 18.500", cat: "Remeras", stock: "14 u." },
      { nombre: "Jean wide leg", sku: "JEA-WID-007", precio: "$ 58.000", cat: "Pantalones", stock: "1 u.", low: true },
      { nombre: "Pantalón sastrero", sku: "PAN-SAS-003", precio: "$ 61.000", cat: "Pantalones", stock: "9 u." },
      { nombre: "Buzo oversize", sku: "BUZ-OVE-022", precio: "$ 47.500", cat: "Abrigos", stock: "3 u.", low: true },
      { nombre: "Campera de gabardina", sku: "CAM-GAB-005", precio: "$ 96.000", cat: "Abrigos", stock: "6 u." },
      { nombre: "Vestido midi floral", sku: "VES-MID-011", precio: "$ 54.000", cat: "Vestidos", stock: "8 u." },
      { nombre: "Cinto de cuero", sku: "ACC-CIN-002", precio: "$ 23.000", cat: "Accesorios", stock: "12 u." },
    ];
    const cat = this.state.cat;

    const carrito = [
      { nombre: "Camisa lino beige", variante: "Talle M · Crudo", qty: 1, subtotal: "$ 42.000" },
      { nombre: "Jean wide leg", variante: "Talle 38 · Azul", qty: 1, subtotal: "$ 58.000" },
      { nombre: "Remera algodón peinado", variante: "Talle S · Negro", qty: 2, subtotal: "$ 37.000" },
    ];

    return {
      usuario, rol,
      inicial: usuario.slice(0, 2).toUpperCase(),
      menuAbierto: this.state.menu ?? false,
      toggleMenu: () => this.setState(st => ({ menu: !st.menu })),
      nav: navItems.map(i => ({
        label: i.label,
        badge: i.badge || false,
        style: "display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;font-size:14.5px;font-weight:" + (i.on ? "600" : "500") + ";color:" + (i.on ? "#4A342A" : "#8C7660") + ";background:" + (i.on ? "#F1E6D6" : "transparent") + ";cursor:pointer;transition:background .15s",
        dotStyle: "width:6px;height:6px;border-radius:50%;flex:none;background:" + (i.on ? "#B87A56" : "#DDCDB6"),
      })),
      categorias: cats.map(c => ({
        label: c,
        onClick: () => this.setState({ cat: c }),
        style: "padding:8px 15px;border-radius:999px;cursor:pointer;font-family:'Work Sans',sans-serif;font-size:13.5px;font-weight:" + (c === cat ? "600" : "500") + ";transition:all .15s;border:1px solid " + (c === cat ? "#B87A56" : "#E4D6C3") + ";background:" + (c === cat ? "#B87A56" : "#FFFCF7") + ";color:" + (c === cat ? "#FFF8F0" : "#6B5545"),
      })),
      productos: prods.filter(p => cat === "Todos" || p.cat === cat).map(p => ({
        ...p,
        ph: p.cat.toLowerCase(),
        stockColor: p.low ? "#D4694A" : "#6B7A4F",
      })),
      carrito,
      cantItems: carrito.reduce((a, i) => a + i.qty, 0),
      total: "$ 137.000",
    };
  }
}
</script>
</body>
</html>
