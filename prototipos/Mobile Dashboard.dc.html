<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #EFE5D6; }
  a { color: #B87A56; text-decoration: none; }
  a:hover { color: #4A342A; }
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:36px 20px;box-sizing:border-box;background:repeating-linear-gradient(135deg,#EFE5D6 0 16px,#EBE0CF 16px 32px);font-family:'Work Sans',system-ui,sans-serif;color:#4A342A">

  <div style="width:390px;height:844px;flex:none;position:relative;border-radius:44px;background:#F7F0E6;border:10px solid #2E2620;box-shadow:0 36px 70px -30px rgba(38,24,18,.6);overflow:hidden;display:flex;flex-direction:column">

    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 26px 6px;font-size:13px;font-weight:600;color:#4A342A">
      <span>9:41</span>
      <span style="display:flex;align-items:center;gap:5px">
        <span style="width:16px;height:9px;border:1px solid #4A342A;border-radius:3px;display:inline-block"></span>
        <span style="width:22px;height:9px;border:1px solid #4A342A;border-radius:3px;display:inline-block;position:relative;background:linear-gradient(to right,#4A342A 72%,transparent 72%)"></span>
      </span>
    </div>

    <header style="display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 20px 14px;border-bottom:1px solid #E4D6C3;background:#FFFCF7">
      <div style="display:flex;align-items:center;gap:10px;min-width:0">
        <div style="width:32px;height:32px;border-radius:10px;background:#F1E6D6;border:1px dashed #E4D6C3;flex:none"></div>
        <span style="font-family:'Fraunces',Georgia,serif;font-size:18px;font-weight:600;line-height:1.1">ShowroomCiro</span>
      </div>
      <div style="position:relative;display:flex;align-items:center;flex:none">
        <button type="button" onClick="{{ toggleMenu }}" style="display:flex;align-items:center;gap:8px;padding:5px 11px 5px 5px;border-radius:999px;background:#F7F0E6;border:1px solid #E4D6C3;cursor:pointer;font-family:'Work Sans',sans-serif;color:#4A342A">
          <span style="width:28px;height:28px;flex:none;border-radius:50%;background:#B87A56;color:#FFF8F0;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center">{{ inicial }}</span>
          <span style="font-size:12.5px;font-weight:600">{{ usuario }}</span>
          <span style="font-size:10px;color:#A89479;line-height:1">▾</span>
        </button>
        <sc-if value="{{ menuAbierto }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;top:calc(100% + 8px);right:0;min-width:178px;padding:6px;border-radius:14px;background:#FFFCF7;border:1px solid #E4D6C3;box-shadow:0 18px 36px -20px rgba(74,52,42,.5);z-index:30">
            <button type="button" style="width:100%;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:12px 13px;border:0;border-radius:10px;background:transparent;cursor:pointer;font-family:'Work Sans',sans-serif;font-size:14px;font-weight:600;color:#4A342A;text-align:left" style-hover="background:#B87A56;color:#FFF8F0">
              <span style="width:6px;height:6px;border-radius:50%;background:#B87A56;flex:none"></span>Cerrar sesión
            </button>
          </div>
        </sc-if>
      </div>
    </header>

    <main style="flex:1;overflow:auto;padding:20px 18px 108px;display:flex;flex-direction:column;gap:16px;background:#F7F0E6">

      <div style="display:flex;flex-direction:column;gap:3px">
        <h1 style="margin:0;font-family:'Fraunces',Georgia,serif;font-size:24px;font-weight:600;letter-spacing:-0.01em;line-height:1.15">Buen día, {{ usuario }}</h1>
        <p style="margin:0;font-size:13.5px;color:#8C7660">{{ fecha }}</p>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="background:#FFFCF7;border:1px solid #E4D6C3;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 26px -24px rgba(74,52,42,.5)">
          <span style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#A89479;font-weight:600">Ventas de hoy</span>
          <span style="font-family:'Fraunces',Georgia,serif;font-size:34px;font-weight:600;line-height:1;letter-spacing:-0.01em">$ 184.500</span>
          <span style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:#6B7A4F;font-weight:500"><span style="width:7px;height:7px;border-radius:50%;background:#6B7A4F"></span>12 ventas · 3 fiadas</span>
        </div>
        <div style="background:#FFFCF7;border:1px solid #E4D6C3;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 26px -24px rgba(74,52,42,.5)">
          <span style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#A89479;font-weight:600">Caja actual</span>
          <span style="font-family:'Fraunces',Georgia,serif;font-size:34px;font-weight:600;line-height:1;letter-spacing:-0.01em">$ 127.300</span>
          <span style="font-size:12.5px;color:#8C7660">Efectivo esperado · apertura $ 20.000</span>
        </div>
      </div>

      <section style="background:#FFFCF7;border:1px solid #E4D6C3;border-radius:16px;padding:18px 20px 20px;display:flex;flex-direction:column;gap:15px;box-shadow:0 10px 26px -24px rgba(74,52,42,.5)">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
          <h2 style="margin:0;font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:600">Alertas</h2>
          <span style="font-size:12px;color:#A89479">5 para revisar</span>
        </div>

        <div style="display:flex;flex-direction:column;gap:9px">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="width:8px;height:8px;border-radius:50%;background:#D4694A"></span>
            <span style="font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#D4694A">Stock bajo</span>
          </div>
          <sc-for list="{{ stock }}" as="s" hint-placeholder-count="3">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 13px;border-radius:12px;background:#FBEEE8;border:1px solid #F0D6C9">
              <span style="display:flex;flex-direction:column;line-height:1.35;min-width:0">
                <span style="font-size:13.5px;font-weight:600">{{ s.nombre }}</span>
                <span style="font-size:12px;color:#96705E">{{ s.variante }}</span>
              </span>
              <span style="font-size:12.5px;font-weight:600;color:#D4694A;white-space:nowrap">{{ s.qty }}</span>
            </div>
          </sc-for>
        </div>

        <div style="display:flex;flex-direction:column;gap:9px">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="width:8px;height:8px;border-radius:50%;background:#7A2E2A"></span>
            <span style="font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#7A2E2A">Fiados</span>
          </div>
          <sc-for list="{{ fiados }}" as="f" hint-placeholder-count="2">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 13px;border-radius:12px;background:{{ f.bg }};border:1px solid {{ f.border }}">
              <span style="display:flex;flex-direction:column;line-height:1.35;min-width:0">
                <span style="font-size:13.5px;font-weight:600">{{ f.cliente }}</span>
                <span style="font-size:12px;color:{{ f.color }};font-weight:500">{{ f.estado }}</span>
              </span>
              <span style="font-size:13.5px;font-weight:600;color:{{ f.color }};white-space:nowrap">{{ f.monto }}</span>
            </div>
          </sc-for>
        </div>
      </section>

    </main>

    <nav style="position:absolute;left:0;right:0;bottom:0;display:flex;align-items:stretch;gap:2px;padding:9px 12px 26px;background:#FFFCF7;border-top:1px solid #E4D6C3">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
        <button type="button" onClick="{{ t.onClick }}" style="{{ t.style }}">
          <span style="{{ t.iconWrap }}">{{ t.icon }}</span>
          <span style="font-size:11px;font-weight:600;letter-spacing:.01em">{{ t.label }}</span>
        </button>
      </sc-for>
    </nav>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:470,&quot;height&quot;:940},&quot;usuario&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Marcos&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { tab: "Dashboard" };

  icono(name, color) {
    const p = { width: 21, height: 21, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 1.9, strokeLinecap: "round", strokeLinejoin: "round" };
    const paths = {
      Dashboard: ["M3 10.5L12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"],
      Cuentas: ["M4 6h16v14H4z", "M4 10h16", "M9 3v4", "M15 3v4"],
      Reportes: ["M5 20V10", "M12 20V4", "M19 20v-7"],
      Configuración: ["M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z", "M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.4-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.4l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4 1.7 1.7 0 0 0-1.6 0z"],
    };
    return React.createElement("svg", p, paths[name].map((d, i) => React.createElement("path", { key: i, d })));
  }

  renderVals() {
    const usuario = this.props.usuario ?? "Marcos";
    const tab = this.state.tab;
    const d = new Date().toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });

    return {
      usuario,
      fecha: d.charAt(0).toUpperCase() + d.slice(1),
      stock: [
        { nombre: "Camisa lino beige", variante: "Talle M · Crudo", qty: "2 u." },
        { nombre: "Jean wide leg", variante: "Talle 38 · Azul", qty: "1 u." },
        { nombre: "Buzo oversize", variante: "Talle L · Negro", qty: "3 u." },
      ],
      fiados: [
        { cliente: "Lucía Fernández", estado: "Vencido hace 4 días", monto: "$ 32.000", bg: "#F6E7E4", border: "#E3C7C2", color: "#7A2E2A" },
        { cliente: "Martín Ríos", estado: "Vence mañana", monto: "$ 18.500", bg: "#FBEEE8", border: "#F0D6C9", color: "#D4694A" },
      ],
      inicial: usuario.slice(0, 2).toUpperCase(),
      menuAbierto: this.state.menu ?? false,
      toggleMenu: () => this.setState(s => ({ menu: !s.menu })),
      tabs: ["Dashboard", "Cuentas", "Reportes", "Configuración"].map(t => {
        const on = t === tab;
        const color = on ? "#B87A56" : "#6B5545";
        return {
          label: t, icon: this.icono(t, color),
          onClick: () => this.setState({ tab: t }),
          style: "flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border:0;border-radius:13px;cursor:pointer;font-family:'Work Sans',sans-serif;transition:all .15s;background:" + (on ? "#F5E7DA" : "transparent") + ";color:" + color,
          iconWrap: "display:flex;align-items:center;justify-content:center;height:22px",
        };
      }),
    };
  }
}
</script>
</body>
</html>
